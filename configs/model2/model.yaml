# Step 1: ConcatFusion — replace SimpleFusion (element-wise sum) with
#         concatenation of avg-pooled drug and protein features.
# Change from base: FUSION.IS_CONCAT=True, DECODER.IN_DIM 128→256.
# All other hyperparameters identical to all_layernorm_esm3B_hid512_o1280_epoch120_lr7e-05.

SOLVER:
  LR: 7e-5
  SEED: [10,20,30,40,50]

DECODER:
  IN_DIM: 128       # dim*2 because ConcatFusion outputs cat([drug, prot])
  HIDDEN_DIM: 512
  OUT_DIM: 64
  BINARY: 1
  DEEP: False

PROTEIN:
  NAME: "ESM_MLP_3B"
  IN_DIM: 2560
  HIDDEN_DIM: 1280
  TARGET_DIM: 128

DRUG:
  HIDDEN_LAYERS: [128, 128, 128]
  NODE_IN_EMBEDDING: 128

ICFE:
  DIM: 128
  NUM_HEAD: 4
  BLOCK_EXP: 4
  N_LAYER: 2
  EMBD_PDROP: 0.0
  ATTN_PDROP: 0.0
  RESID_PDROP: 0.0
  LOOPS_NUM: 1
  IS_ICFE: True

MHSA:
  DIM: 128
  N_LAYER: 1
  N_HEAD: 4
  DROP_RATE: 0.1
  IS_MHSA: True

MCDC:
  KERNEL_LIST: [3, 5, 7]
  K: 2
  IS_MCDC: True

FUSION:
  IS_CONCAT: False
  IS_DCPA: False
  USE_ATTN_POOL: False
  N_HEAD: 4
